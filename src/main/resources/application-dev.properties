spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DEV_Database_url}
spring.datasource.username=${DEV_Postgres_User}
spring.datasource.password=${DEV_Postgres_Password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


management.endpoints.web.exposure.include=health,info,metrics,swagger-ui,prometheus
management.endpoint.health.show-details = always

management.metrics.enable.all=true

springdoc.show-actuator=true

management.endpoint.prometheus.enabled=true

logging.level.root=INFO


app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With
app.cors.exposed-headers=Authorization
app.cors.allow-credentials=true
app.cors.max-age=3600




